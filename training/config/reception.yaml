# PROTOCOLE DE RECEPTION, pas un protocole de decision.
#
# Tailles minuscules et risque non controle : il sert uniquement a exercer la
# machinerie — tentative de confirmation enregistree, plan de graines fige, vague
# neuve a chaque nouvelle tentative, reprise d'une tentative coupee, plafond de
# campagne impose — sur de vrais combats et en un temps borne. Aucune promotion ne
# doit sortir d'ici.
#
# Configuration du harnais d'amelioration du scoring.
#
# Tous les nombres ci-dessous sont des VALEURS INITIALES, pas des mesures. Le pilote de debit
# et les premieres donnees de developpement servent a les ajuster, puis a les FIGER avant de
# lancer les confirmations d'une campagne. Les changer apres avoir vu des resultats de
# confirmation invaliderait le risque annonce.

campagne:
  # Changer le protocole — formats, moteur, builds, ligne de ligue, parseur — demande une
  # NOUVELLE campagne. `init-campaign` refuse de reecrire une campagne existante sous un autre
  # protocole : des resultats deja lus ne doivent pas changer de sens en silence.
  # campagne-002 : premiere campagne avec les deux camps reels du format team, les blocs
  # emboites entre etapes et le diagnostic de chargement d'IA. FIGEE.
  # campagne-003 : S2 passe a cinq blocs team, faute de quoi le cinquieme adversaire n'avait
  # aucun bloc et la couverture rendait INCOMPLET quoi qu'il arrive.
  id: "reception-b"
  # Plafond de promotions automatiques. Au-dela, la boucle s'arrete et rend un bilan ; la
  # campagne suivante est un nouveau choix explicite de budget. Le risque nominal ci-dessous
  # vaut pour CE budget, pas pour une suite illimitee de campagnes.
  confirmations_max: 2
  risque_nominal_campagne: 0.05
  alpha_par_confirmation: 0.05      # protocole de RECEPTION, pas de decision

moteur:
  racine: "C:/Users/aurel/Desktop/lw-gen"
  java_home: null                   # null = deduit du java du PATH
  # Coeurs REELS de chaque build, aucun plancher ni plafond. Les combats vont jusqu'a la
  # limite normale du moteur (64 tours). Les combats tronques sont des controles techniques.
  coeurs: "reels"
  tours_max: 64

objectif:
  # Echelle victoire = 1, nul = 0,5, defaite = 0. Un plancher de -0.05 vaut donc cinq points
  # de resultat moyen, pas cinq pour cent.
  poids:
    farmer: 0.80
    solo: 0.15
    team: 0.05
    br: 0.00
  format_principal: farmer
  planchers_empiriques:
    solo: -0.05
    team: -0.05
  gain_minimal_farmer: 0.01

# Tailles de lots, en BLOCS (un bloc = 4 combats, dont 2 reutilisables entre candidats).
#
# Les sous-ensembles d'adversaires sont des PREFIXES du panel de la campagne, et les tailles
# croissent : les blocs de S1 sont donc reellement contenus dans ceux de S2, et ceux de S2 dans
# ceux de S3. Le cout annonce entre etapes est cumulatif parce que le plan de blocs le garantit,
# pas parce qu'on l'espere.
#
# REGLE DURE : un bloc porte UN adversaire, donc chaque format actif doit avoir AU MOINS autant
# de blocs que l'etape a d'adversaires. `init-campaign` refuse un plan qui ne la respecte pas,
# et verifie aussi l'emboitement sur les tailles retenues.
etapes:
  s1:
    candidats: 1
    blocs: { farmer: 2,  solo: 2 }
    adversaires: 2
    garder: 1
  s2:
    blocs: { farmer: 4,  solo: 4,  team: 2 }
    adversaires: 2
    garder: 1
  s3:
    blocs: { farmer: 4,  solo: 4,  team: 2 }
    adversaires: 2
    garder: 1
  confirmation:
    blocs: { farmer: 2,  solo: 2,  team: 2 }
    adversaires: 2
    graines_neuves: true
    # Formats dont la couverture COMPLETE est exigee pour une promotion. Un format prevu dont
    # les blocs ou les adversaires manquent donne INCOMPLET, jamais un verdict statistique sur
    # l'echantillon survivant.
    formats_requis: [farmer, solo, team]

# La BR est un rapport periodique, pas un veto. L'appeler « audit » ne la rend pas
# independante : si elle doit bloquer une promotion, il faut l'inscrire dans la validation et
# lui donner un echantillon suffisant.
br:
  declenchement_toutes_les_n_promotions: 5
  lobbies: 12
  creneaux_focaux_par_lobby: 2
  veto: false

ligue:
  source: "C:/Users/aurel/Desktop/LeekWars - Validation/versions.json"
  # Ancre historique : suit la derive a long terme. Commit RESOLU, jamais une reference
  # mouvante a une branche.
  ancre: "scoring/champion-000"

debit:
  workers: 1                        # a regler apres le pilote ; un worker = une JVM
  taille_lot: 8                     # combats par JVM ; la file est repartie entre les workers
  timeout_lot_secondes: 1800
  budget_pilote_secondes: 600

optimiseur:
  mode: "manuel"                    # manuel = on enregistre un patch a la main, aucun appel paye
  portee:
    - "New_AI/Scoring/**"
    - "New_AI/User/BFS.leek"        # la coupe et son majorant sont modifiables
  hors_portee:
    - "training/**"                 # evaluateur, seuils, builds, coeurs, graines
    - "New_AI/Load/Cache.leek"      # extension possible, mais explicite et journalisee
  # Perimetre EFFECTIF a l'interieur des fichiers autorises. Autoriser BFS.leek autorise la
  # coupe et son majorant, pas le retrait des gardes du budget interne d'operations : une IA
  # sans garde ne perd pas de la recherche, elle se fait couper par le moteur, et aucun combat
  # ne facture cela comme un mauvais scoring.
  invariants:
    "New_AI/User/BFS.leek":
      - motif: "getOperations\\(\\) > OPS_DEADLINE"
        minimum: 3
        raison: "gardes du budget interne d'operations de la coupe"
  candidats_max_par_vague: 4
